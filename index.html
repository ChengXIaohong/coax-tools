<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="root@coax 提供 JSON 格式化、图片压缩、测试数据构造、字符画、文字云、TXT转EPUB 等纯前端在线工具。所有数据在浏览器本地处理，不上传服务器。">
    <meta name="keywords" content="在线工具, 图片压缩, JSON格式化, 测试数据构造, 字符画, 文字云, Txt转Epub">
    <meta name="author" content="coax">
    <title>root@coax · 开源在线小工具集合</title>
    <!-- 微信/社交平台分享卡片：缺失会导致分享卡片无描述、无缩略图，命中低质链接判定 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="root@coax">
    <meta property="og:title" content="root@coax · 开源在线小工具集合">

    <meta property="og:image" content="https://www.tools.coax.uno/images/og-cover.png">
    <meta name="twitter:card" content="summary_large_image">
    <!-- 主题初始化：防止 FOUC 闪烁。必须在样式表之前执行。 -->
    <script>
    (function() {
        // 默认暖纸浅色；历史值 'sci-fi' 属于旧的深色主题，迁移为 'dark' 以保留用户偏好
        var saved = localStorage.getItem('coax-tools-mode');
        var theme = (saved === 'dark' || saved === 'sci-fi') ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
    })();
    </script>
    <link rel="stylesheet" href="styles/theme-base.css?v=20260930">
    <link rel="stylesheet" href="styles/theme-paper.css?v=20260930">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5' fill='none' stroke='%235C6E63' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='15' fill='none' stroke='%235C6E63' stroke-width='6'/%3E%3C/svg%3E">
</head>
<body>

        <div class="topbar__logo">tools.coax.uno</div>
        <div class="topbar__spacer"></div>

            <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>

            <span class="search__kbd">⌘K</span>
        </div>
        <div class="topbar__spacer"></div>
        <button class="topbar__theme" id="themeToggle" type="button" aria-label="切换明暗主题">浅色</button>
    </header>

    <nav class="catbar" id="catBar" aria-label="工具分类"></nav>

    <main>
        <div class="tool-grid" id="toolsGrid"></div>
        <div class="no-results hidden" id="noResults">
            <p class="no-results__text">// 没有匹配的工具</p>
        </div>
    </main>
